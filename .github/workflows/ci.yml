name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests, static analysis, assets, browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # No lock file in the skeleton. Sites get the latest tagged framework (^0.1@dev, prefer-stable);
      # the skeleton itself is tested against the framework's main branch, where its next changes are.
      - name: Install PHP dependencies (framework main)
        run: |
          composer config prefer-stable false
          composer update --no-interaction --no-progress --prefer-dist

      - name: Install JS dependencies
        run: npm ci

      # Before the tests, so the ones that check built assets run too.
      - name: Build assets
        run: npm run build

      - name: Tests
        run: vendor/bin/phpunit

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # The real site in Chromium (tests/e2e): no CSP violations or errors on any page, Datastar,
      # theme, persistence, click-to-load videos, translated URLs, no-JavaScript fallbacks.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
